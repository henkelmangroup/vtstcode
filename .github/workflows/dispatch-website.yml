name: website-push
on:
  push:
    branches: [main]
permissions: {}
jobs:
  notify-website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3 
        id: app-token
        with:
          app-id: ${ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: vtsttools
      - run: |
          gh api repos/henkelmangroup/vtsttools/dispatches \
            -f event_type=code_updated
        env:
            GH_TOKEN: ${{ steps.app-token.outputs.token }}